name: Self Hosted Runner Check

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: 'Optional custom runner label (leave empty for default self-hosted runner)'
        required: false
        default: ''
        type: string

jobs:
  check-runner:
    runs-on: ${{ github.event.inputs.runner_label || 'self-hosted' }}

    steps:
      - name: Show machine
        run: |
          echo "Runner is alive"
          hostname
          uname -a

      - name: Check tools
        run: |
          docker --version
          kubectl version --client
          helm version
          minikube status