name: Deploy With Direct Registry Pull

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
      image_tag: ${{ steps.image.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create image details
        id: image
        run: |
          IMAGE_NAME="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="${{ github.sha }}-${{ github.run_number }}"

          echo "IMAGE_NAME=$IMAGE_NAME"
          echo "IMAGE_TAG=$IMAGE_TAG"

          echo "image_name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.image_tag }}" \
            ./app

      - name: Push image
        run: |
          docker push \
            "${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.image_tag }}"

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GHCR pull secret in Kubernetes
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          helm upgrade --install tiny-app ./helm/tiny-app \
            -f ./helm/tiny-app/values-pull-directly-into-orchestrator.yaml \
            --set image.repository="${{ needs.build-and-push.outputs.image_name }}" \
            --set image.tag="${{ needs.build-and-push.outputs.image_tag }}"

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/tiny-app --timeout=120s

      - name: Show deployed image
        run: |
          kubectl get deployment tiny-app \
            -o jsonpath='{.spec.template.spec.containers[0].image}'
          echo

      - name: Show pods
        run: kubectl get pods -o wide

      - name: Show image pull events
        run: |
          POD_NAME="$(kubectl get pods \
            -l app=tiny-app \
            -o jsonpath='{.items[0].metadata.name}')"

          kubectl describe pod "$POD_NAME"

      - name: Start port forward
        run: |
          kubectl port-forward service/tiny-app 3000:80 \
            > /tmp/tiny-app-port-forward.log 2>&1 &

          echo $! > /tmp/tiny-app-port-forward.pid
          sleep 3

      - name: Smoke test
        run: |
          curl -f http://localhost:3000/health

      - name: Show port-forward logs
        if: always()
        run: |
          cat /tmp/tiny-app-port-forward.log || true

      - name: Stop port forward
        if: always()
        run: |
          if [ -f /tmp/tiny-app-port-forward.pid ]; then
            kill "$(cat /tmp/tiny-app-port-forward.pid)" || true
          fi