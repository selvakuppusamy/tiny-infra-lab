name: Minikube Check in CI Runner

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/06-minikube-check-in-ci-runner.yml

permissions:
  contents: read

jobs:
  minikube:
    name: Docker and Minikube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Docker and show status
        run: |
          sudo systemctl start docker
          systemctl is-active docker
          docker version
          docker context ls
          docker info

      - name: Start Minikube
        run: |
          minikube version
          minikube start --driver=docker --wait=all --wait-timeout=5m

      - name: Check cluster readiness
        run: |
          minikube status
          minikube kubectl -- get --raw='/readyz'
          minikube kubectl -- wait --for=condition=Ready nodes --all --timeout=120s
          minikube kubectl -- get nodes -o wide
          minikube kubectl -- get pods -n kube-system
